<div class="card"><h2>🌶️ Product પસંદ કરો</h2><div class="grid"><div class="field" style="grid-column:span 2"><label>Product</label><select id="productSelect" onchange="selectProduct()"><option value="">-- Product પસંદ કરો --</option></select></div><div class="field" style="grid-column:span 2"><label>પેકિંગ</label><select id="packingSelect" onchange="showResult()"><option value="">-- પેકિંગ પસંદ કરો --</option></select></div></div><div class="actions"><button class="blue" id="editBtn" onclick="openEdit()" disabled>✏️ Product Edit કરો</button><button class="danger" id="deleteBtn" onclick="deleteSelected()" disabled>🗑️ Product Delete</button></div><div id="selectedResult"></div></div>
</div>
<div class="footer">Created with ❤️ by Gajendrasinh Ataliya</div>

<div class="modal" id="editModal"><div class="modalbox"><h2>✏️ Product Edit કરો</h2><div class="grid">
<div class="field"><label>Product નામ</label><input id="editName"></div><div class="field"><label>મૂળ ભાવ ₹ / કિલો</label><input id="editPrice" type="number" min="0" step="0.01"></div><div class="field"><label>એક પેકેટની MRP ₹</label><input id="editMRP" type="number" min="0" step="0.01"></div><div class="field"><label>Free Scheme (%)</label><input id="editScheme" type="number" min="0" step="0.01"></div></div><div class="field" style="margin-top:12px"><label>પેકિંગ (ગ્રામ)</label><input id="editPacks" placeholder="50,100,200,500,1000"></div><div class="actions"><button class="primary" onclick="saveEdit()">💾 ફેરફાર Save કરો</button><button class="gray" onclick="closeEdit()">બંધ કરો</button></div></div></div>
<script>
const $=id=>document.getElementById(id); const money=n=>'₹ '+Number(n||0).toFixed(2); let selectedId=null;
function products(){return JSON.parse(localStorage.getItem('masalaProducts')||'[]')}
function saveAll(a){localStorage.setItem('masalaProducts',JSON.stringify(a))}
function addProduct(){let name=$('newName').value.trim(),price=+$('newPrice').value,mrp=+$('newMRP').value,scheme=+$('newScheme').value||0,packs=$('newPacks').value.split(',').map(x=>+x.trim()).filter(x=>x>0);if(!name||!price||!packs.length){alert('Product નામ, મૂળ ભાવ અને પેકિંગ દાખલ કરો.');return}let a=products();a.push({id:Date.now(),name,price,mrp,scheme,packs});saveAll(a);$('newName').value='';$('newPrice').value='';$('newMRP').value='';$('newScheme').value='10';refresh();$('productSelect').value=a[a.length-1].id;selectProduct();alert('Product સફળતાપૂર્વક Save થયો.')}
function refresh(){let a=products();$('productSelect').innerHTML='<option value="">-- Product પસંદ કરો --</option>'+a.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');if(selectedId&&a.some(p=>p.id==selectedId))$('productSelect').value=selectedId}
function selectProduct(){selectedId=+$('productSelect').value||null;let p=products().find(x=>x.id===selectedId);$('editBtn').disabled=!p;$('deleteBtn').disabled=!p;if(!p){$('packingSelect').innerHTML='<option value="">-- પેકિંગ પસંદ કરો --</option>';$('selectedResult').innerHTML='';return}$('packingSelect').innerHTML=p.packs.map(g=>`<option value="${g}">${g}g</option>`).join('');showResult()}
function showResult(){let p=products().find(x=>x.id===selectedId),g=+$('packingSelect').value;if(!p||!g){$('selectedResult').innerHTML='';return}let net=p.price/(1+p.scheme/100),netPack=net*g/1000,mrpKg=+p.mrp||0,free=10*p.scheme/100,total=10+free;$('selectedResult').innerHTML=`<div class="result"><b style="font-size:18px">${p.name} • ${g}g</b><div class="pricegrid"><div class="pricebox"><div class="label">નેટ ભાવ / કિલો</div><div class="value">${money(net)}</div></div><div class="pricebox"><div class="label">${g}g નેટ ભાવ</div><div class="value">${money(netPack)}</div></div><div class="pricebox"><div class="label">એક પેકેટની MRP</div><div class="value">${money(mrpKg)}</div></div></div><div class="small">મૂળ ભાવ: ${money(p.price)}/kg • Scheme: ${p.scheme}% Free • 10kg + ${free.toFixed(2)}kg Free = ${total.toFixed(2)}kg</div></div>`}
function openEdit(){let p=products().find(x=>x.id===selectedId);if(!p)return;$('editName').value=p.name;$('editPrice').value=p.price;$('editMRP').value=p.mrp||'';$('editScheme').value=p.scheme||0;$('editPacks').value=p.packs.join(',');$('editModal').style.display='block'}
function closeEdit(){$('editModal').style.display='none'}
function saveEdit(){let a=products(),i=a.findIndex(x=>x.id===selectedId);if(i<0)return;let name=$('editName').value.trim(),price=+$('editPrice').value,mrp=+$('editMRP').value,scheme=+$('editScheme').value||0,packs=$('editPacks').value.split(',').map(x=>+x.trim()).filter(x=>x>0);if(!name||!price||!packs.length){alert('વિગતો સાચી રીતે દાખલ કરો.');return}a[i]={...a[i],name,price,mrp,scheme,packs};saveAll(a);closeEdit();refresh();$('productSelect').value=selectedId;selectProduct();alert('Product ની વિગતો Update થઈ ગઈ.')}
function deleteSelected(){let p=products().find(x=>x.id===selectedId);if(!p)return;if(confirm('"'+p.name+'" Product delete કરવો છે?')){saveAll(products().filter(x=>x.id!==selectedId));selectedId=null;refresh();$('packingSelect').innerHTML='<option value="">-- પેકિંગ પસંદ કરો --</option>';$('selectedResult').innerHTML='';$('editBtn').disabled=true;$('deleteBtn').disabled=true}}
refresh();
</script></body></html>
